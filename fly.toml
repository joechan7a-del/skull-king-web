# Fly.io 範本。用 `fly launch` 或 `fly deploy` 前，把 app 名改成你自己嘅。
# 呢個檔案本身唔會開任何雲端服務。

app = "skull-king-web"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
